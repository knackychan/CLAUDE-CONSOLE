<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- The mark: a board of cells (console-cells.html motif), a lit route climbing to the signal.
       Pixel versions: console/icon.py (assets/). Colours: --win, --off, --ink, --you. -->
  <rect width="256" height="256" rx="48" fill="#121315"/>
  <g fill="#24272b">
    <rect x="16" y="16" width="64" height="64" rx="11.5"/>
    <rect x="176" y="96" width="64" height="64" rx="11.5"/>
    <rect x="96" y="176" width="64" height="64" rx="11.5"/>
    <rect x="176" y="176" width="64" height="64" rx="11.5"/>
  </g>
  <g fill="#ebe8e1">
    <rect x="16" y="176" width="64" height="64" rx="11.5"/>
    <rect x="16" y="96" width="64" height="64" rx="11.5"/>
    <rect x="96" y="96" width="64" height="64" rx="11.5"/>
    <rect x="96" y="16" width="64" height="64" rx="11.5"/>
  </g>
  <rect x="176" y="16" width="64" height="64" rx="11.5" fill="#ff8a3d"/>
</svg>
