<!doctype html>
<html lang="en" data-theme="dark" data-playback="paused">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Console · Task orchestration exploration</title>
<link rel="stylesheet" href="reference-tokens.css">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="review-tools">
  <div class="review-line"><strong>Task orchestration / design exploration</strong><a class="btn" href="version-b/index.html">Version B · Projects &amp; dock</a><button class="btn" id="theme">Light theme</button><details id="review-controls"><summary>Review controls</summary><div class="controls">
    <label>Scenario <select id="scenario"></select></label>
    <label>Frame <select id="viewport"><option value="1460">Desktop</option><option value="900">900 px</option><option value="400">400 px</option><option value="340">340 px</option></select></label>
    <label>Connections <select id="connections"><option value="default">Sample connections</option><option value="codex-off">Codex disconnected</option><option value="none">No eligible CLI</option></select></label>
    <label>Assignment load <select id="activity"><option value="snapshot">Current snapshot</option><option value="idle">Both idle</option><option value="astra-active">Astra active, Opus idle</option></select></label>
    <button class="btn" id="playback" aria-pressed="false">Play stream</button><button class="btn" id="advance">Step simulation</button><button class="btn" id="reset">Reset sample</button><a class="btn" href="review.html">Review notes</a>
  </div></details></div>
  <p class="disclosure">Fictional sample tasks. Every action is simulated. Proposed design.</p>
</header>
<div class="window" id="window">
  <header class="topbar"><span class="brand-cells" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="brand">Console</span><span class="chrome-divider" aria-hidden="true"></span><span class="chrome-title">Supervision</span><nav aria-label="Console"><button class="btn nav" data-view="tasks">Tasks</button><button class="btn nav" data-view="new">New task</button><button class="btn nav" data-view="usage">Usage</button><button class="btn nav" data-view="settings">Settings</button></nav><span class="attention mono" id="top-count">3 for you</span></header>
  <section id="usage-strip" class="usage-strip" aria-label="Shared model usage"></section>
  <main id="main" aria-label="Console workspace"></main>
  <footer class="product-footer"><span>Sample workspace · no live workers connected</span><span>Drafts stay in this tab until reset or refresh</span></footer>
  <p class="feedback" id="feedback" role="status" aria-live="polite" hidden></p>
</div>
<dialog id="inspector" aria-labelledby="dialog-title"><div class="row spread"><h2 id="dialog-title"></h2><button class="btn" id="close-dialog">Close</button></div><div id="dialog-body"></div></dialog>
</body>
</html>
