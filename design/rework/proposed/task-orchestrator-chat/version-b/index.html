<!doctype html>
<html lang="en" data-theme="dark" data-playback="paused">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Console · Task orchestrator · Version B</title>
<link rel="stylesheet" href="../reference-tokens.css">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="version-b.css">
<script src="../app.js" defer></script>
<script src="version-b.js" defer></script>
</head>
<body>
<header class="review-tools">
  <div class="review-line"><strong>Task orchestrator / Version B · Projects &amp; dock</strong><a class="btn" href="../index.html">Version A</a><a class="btn" href="review.html">Design decisions</a><button class="btn" id="theme">Light theme</button><details id="review-controls"><summary>Review controls</summary><div class="controls">
    <label>Scenario <select id="scenario"></select></label>
    <label>Frame <select id="viewport"><option value="1460">Desktop</option><option value="900">900 px</option><option value="400">400 px</option><option value="340">340 px</option></select></label>
    <label>Connections <select id="connections"><option value="default">Sample connections</option><option value="codex-off">Codex disconnected</option><option value="none">No eligible CLI</option></select></label>
    <label>Assignment load <select id="activity"><option value="snapshot">Current snapshot</option><option value="idle">Both idle</option><option value="astra-active">Astra active, Opus idle</option></select></label>
    <button class="btn" id="playback" aria-pressed="false">Play stream</button><button class="btn" id="advance">Step simulation</button><button class="btn" id="reset">Reset sample</button>
  </div></details></div>
  <p class="disclosure">Fictional sample tasks. Every action is simulated. Proposed, not approved.</p>
</header>
<div class="window" id="window">
  <header class="topbar"><span class="brand-cells" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="brand">Console</span><span class="chrome-divider" aria-hidden="true"></span><span class="chrome-title">Tasks</span><nav aria-label="Console"><button class="btn nav" data-view="tasks">Tasks</button><button class="btn nav" data-view="new">New task</button><button class="btn nav" data-view="usage">Usage</button><button class="btn nav" data-view="settings">Settings</button></nav><button class="attention mono b-attention-link" id="top-count" data-decisions>3 for you</button></header>
  <section id="usage-strip" class="usage-strip" aria-label="Shared model usage"></section>
  <main id="main" aria-label="Console workspace"></main>
  <footer class="product-footer"><span>Sample workspace · no live workers connected</span><span>One task · one assigned orchestrator</span></footer>
  <p class="feedback" id="feedback" role="status" aria-live="polite" hidden></p>
</div>
<dialog id="inspector" aria-labelledby="dialog-title"><div class="row spread"><h2 id="dialog-title"></h2><button class="btn" id="close-dialog">Close</button></div><div id="dialog-body"></div></dialog>
</body>
</html>
