<script>

const initialTasks=[
 {id:'import',brief:'Import the sample customer records. Ask me how to merge notes when a customer already exists.',number:'T-017',project:'Fieldnotes CRM',title:'Keep customer notes on import',state:'question',current:3,steps:['Inspect import format','Map customer fields','Resolve duplicate notes','Import sample','Verify records'],kind:'Code',latest:'Duplicate matching is ready. One data rule needs your decision.',update:'2 min ago',mode:'Gated',question:'When a customer already has notes, should the imported notes replace them or be appended?',history:'I found 18 sample rows that match existing customers. I paused before changing any notes.',stepInfo:'Awaiting your answer before writing the duplicate-note rule.'},
 {id:'audio',brief:'Check retry limits and cancellation against the saved export timeout trace.',number:'T-024',project:'Waveform Studio',title:'Retry interrupted audio exports',state:'recommendation',current:4,steps:['Trace export timeout','Add bounded retry','Exercise cancellation','Verify retry limits','Document behaviour'],kind:'Verify',latest:'Cancellation passed. Retry-limit verification failed a second time.',update:'4 min ago',mode:'Suggest',recommendation:'Retry step 4 on Opus with the timeout trace attached.',reason:'The same boundary case failed twice. The task supervisor suggests a stronger verification pass; it has not started.',history:'The second verification reproduced a retry after cancellation. The trace is saved with step 4.',stepInfo:'Verify the retry limit and cancellation race with the saved timeout trace.'},
 {id:'thumbnails',brief:'Implement a bounded thumbnail cache. Preserve the requested image dimensions.',number:'T-031',project:'Catalog Atlas',title:'Cache product thumbnails',state:'running',current:3,steps:['Inspect image loader','Define cache key','Implement cache','Verify eviction','Record results'],kind:'Code',latest:'Cache keys now include the requested size. Adding eviction handling.',update:'1 min ago',mode:'Auto',history:'The cache key now separates 160 px and 320 px previews. I am adding a bounded cache before verification.',stepInfo:'Implement a bounded thumbnail cache without changing image dimensions.'},
 {id:'captions',brief:'Carry speaker names through parsing and export, then verify the round trip.',number:'T-038',project:'Frame Orchard',title:'Preserve speaker names in captions',state:'running',current:2,steps:['Read caption schema','Add speaker mapping','Verify round trip','Write handoff'],kind:'Code',latest:'Speaker names are retained through parsing. Updating export mapping.',update:'3 min ago',mode:'Auto',history:'The parser keeps the speaker name. I am adding the corresponding export field.',stepInfo:'Carry the speaker name through the caption export mapping.'},
 {id:'search',brief:'Add keyboard search and return focus to the reader after closing search.',number:'T-033',project:'Harbor Reader',title:'Add keyboard search',state:'running',current:2,steps:['Audit shortcuts','Build search entry','Wire results','Verify keyboard flow'],kind:'Code',latest:'Search opens from the keyboard. Wiring focus back to the reader.',update:'Just now',mode:'Auto',history:'The search shortcut opens the input. I am checking focus return before wiring the results list.',stepInfo:'Build a search entry that preserves the reader’s current position.'},
 {id:'archive',brief:'Prepare the invoice archive and manifest. Verify that every sample invoice is accounted for.',number:'T-012',project:'Ledger Grove',title:'Export invoice archive',state:'finished',current:4,steps:['Read export format','Build archive','Verify manifest','Write handoff'],kind:'Done',latest:'Archive and manifest are ready. Verification passed; awaiting your acceptance.',update:'6 min ago',mode:'Gated',history:'The sample archive contains 24 invoices and a matching manifest. The verification step reports PASS.',stepInfo:'Final handoff saved with the sample manifest and verification result.'},
];
// Sample snapshot: token totals include earlier steps; context belongs only to the displayed run.
const sampleUsage={
 import:{model:'Sonnet',contextTokens:84000,usage:[{model:'Sonnet',tokens:220000,cents:128}]},
 audio:{model:'Sonnet',contextTokens:186000,usage:[{model:'Opus',tokens:260000,cents:190},{model:'Sonnet',tokens:220000,cents:127}]},
 thumbnails:{model:'Sonnet',contextTokens:72000,usage:[{model:'Sonnet',tokens:360000,cents:142}]},

for(const t of initialTasks)Object.assign(t,sampleUsage[t.id]);
const tasks=structuredClone(initialTasks);
const usd=cents=>cents==null?'Unknown':'$'+(cents/100).toFixed(2);
const tokens=n=>n>=1000000?(n/1000000).toFixed(2)+'M':Math.round(n/1000)+'K';
function usageTotal(rows){return {tokens:rows.reduce((sum,r)=>sum+r.tokens,0),cents:rows.reduce((sum,r)=>sum+(r.cents??0),0),unknown:rows.filter(r=>r.cents==null).length};}
function cells(filled,total=15,style='filled',threshold=-1){return `<span class="meter-cells" aria-hidden="true">${Array.from({length:total},(_,i)=>`<i class="${i<filled?style:''} ${i===threshold?'threshold':''}"></i>`).join('')}</span>`;}
function renderUsage(){
 const rows=tasks.flatMap(t=>t.usage),total=usageTotal(rows);
 const models=['Sonnet','Opus','Haiku','Codex'].map(model=>({model,...usageTotal(rows.filter(r=>r.model===model))}));
 $('usage-summary').setAttribute('aria-label',`Today across all projects: estimated API cost ${usd(total.cents)}, plus ${total.unknown} unpriced run. ${tokens(total.tokens)} tokens processed. Show or hide sample usage breakdown.`);
 const cost=r=>r.unknown?(r.cents?'~'+usd(r.cents)+' + unknown':'Unknown'):'~'+usd(r.cents);
 $('usage-summary').innerHTML=`<div class="usage-cost"><span class="usage-amount" id="usage-amount">${usd(total.cents)}</span><div class="usage-caption"><strong>Today · est. API cost</strong>${cells(Math.min(30,Math.round(total.cents/50)),30,'estimated',23)}<span>All projects · sample · +${total.unknown} unpriced run</span></div></div><div class="usage-models" aria-label="Model share of processed tokens today">${models.map(m=>`<div class="usage-model"><div class="row"><span>${m.model}</span><span>${tokens(m.tokens)}</span></div>${cells(Math.round(m.tokens/total.tokens*15))}<small>${Math.round(m.tokens/total.tokens*100)}% of processed tokens</small></div>`).join('')}</div><span class="usage-mobile-total">${tokens(total.tokens)} tokens processed</span><span class="usage-toggle">Usage</span>`;
 $('usage-breakdown').innerHTML=`<div><h2>Today, across all projects</h2><p>Sample snapshot · estimated USD at list prices, not billed totals. ${total.unknown} unpriced run excluded.</p><p>Spend cells: $0.50 each · $15 sample budget · marker at 80%. Model cells show processed token share, including cached reads and writes.</p><p>Context cells: latest reading for one step, against a sample 300K Console handoff threshold, not the model capacity.</p></div><table aria-label="Sample model usage today"><thead><tr><th scope="col">Model</th><th scope="col">Processed tokens</th><th scope="col">Est. cost</th></tr></thead><tbody>${models.map(m=>`<tr data-usage-model="${m.model}"><th scope="row">${m.model}</th><td>${tokens(m.tokens)}</td><td>${cost(m)}</td></tr>`).join('')}</tbody><tfoot><tr><th scope="row">All models</th><td>${tokens(total.tokens)}</td><td>~${usd(total.cents)} + ${total.unknown} unpriced</td></tr></tfoot></table>`;
}
function taskTelemetry(t,step=t.current,detail=false){
 const current=step===t.current,ctx=current?t.contextTokens:null,high=ctx!=null&&ctx>=150000;
 const total=usageTotal(t.usage),cost=total.unknown?(total.cents?'~'+usd(total.cents)+' + ?':'Unknown'):'~'+usd(total.cents);
 const missing=!current?(step>t.current?'Not started':'Not recorded'):t.id==='audio'&&t.state==='running'?'Awaiting retry reading':'Not reported';
 const description=ctx==null?`Context: ${missing.toLowerCase()}.`:`Context: ${tokens(ctx)} tokens at the last reading for step ${step}; ${Math.round(ctx/300000*100)}% of the Console sample 300K handoff threshold. This threshold is not the model capacity.`;
 return `<div class="task-telemetry" data-telemetry="${t.id}"><span class="task-model" title="${current?'Model for step '+step:'No model recorded for this step'}">${current?esc(t.model):'Model —'}</span><span class="task-context" data-pressure="${high?'high':'normal'}" title="${esc(description)}" aria-label="${esc(description)}">${ctx==null?'':cells(Math.min(15,Math.round(ctx/20000)),15,high?'caution':'filled')}<span class="${ctx==null?'unknown':''}">Ctx ${ctx==null?'—':tokens(ctx)}</span></span><span class="task-cost" title="Estimated total cost for this task, across all steps. Sample USD.">Task ${cost}</span></div>${detail?`<p class="task-telemetry-note">Step ${step} · ${ctx==null?'context '+missing.toLowerCase():'last context reading'+(high?' · above 150K advisory':'')} · cost across all task steps</p>`:''}`;
}
let selected='import',tab='now',viewedStep=3,globalOpen=false,filter='all',query='',demoTick=0,demoPlaying=false;
let boardOpen=true,gridFilter='all',globalReturn='grid',projectScope='all';

const gridFollowing={},gridPositions={},gridTools={};

const cacheFrames=[
 {agent:'The cache key includes the requested size. I’m adding',tool:'Edit',command:'src/images/thumbnailCache.ts',toolState:'Queued',output:'Read complete: found an unbounded Map cache.'},

function stepEvents(t,step){
 const user=(id,text)=>({id,who:'user',text});
 const agent=(id,text,active=false)=>({id,who:'agent',text,active});
 const tool=(id,name,command,status,output,active=false)=>({id,who:'tool',name,command,status,output,active});
 if(step>t.current)return [];
 if(step<t.current)return [user('brief',t.steps[step-1]+'. Keep the existing behaviour outside this change.'),agent('saved','This sample step is completed. Its result was handed to the next step.'),tool('saved-tool','Read','steps/'+String(step).padStart(2,'0')+'/handoff.md','Completed','Saved sample handoff for '+t.steps[step-1]+'.')];
 let events=[user('brief',t.brief)];
 if(t.id==='thumbnails'){
  const phase=Math.min(5,Math.floor(demoTick/4));

  if(phase>=4)events.push(agent('diff-intro',cacheFrames[4].agent),tool('diff','Bash','git diff -- src/images/thumbnailCache.ts',phase<5?'Running · '+duration(demoTick-16):'Exited 0 · 4s',phase<5?'Reviewing the saved diff…':cacheFrames[5].output,phase<5));
  if(phase>=5)events.push(agent('final',cacheFrames[5].agent));
 }else if(t.id==='captions'||t.id==='search'){
  const a=activity(t);events.push(agent('explain',a.agent),tool('command',a.tool,a.command,a.toolState+' · '+duration(a.elapsed),a.output,a.toolActive));
 }else if(t.id==='import'){
  events.push(agent('findings',t.history),tool('read','Read','src/import/mergeCustomerNotes.ts','Completed','18 duplicate matches found. No notes changed.'),agent('question',t.question));
 }else if(t.id==='audio'){
  events.push(agent('explain','I’m rerunning the cancellation and retry-limit checks with the saved timeout trace.'),tool('test','Bash','npm test -- export-retry-limits --run','Exited 1 · 41s','2 retry-limit checks failed. Trace saved.'),agent('result',t.history));
  events.push({id:'recommendation-location',who:'notice',text:'The run ended. The task supervisor’s recommendation is available under Now.'});
 }else events.push(agent('result',t.history));
 for(const [i,m] of (messages[t.id]||[]).entries())if(m.step===step)events.push({...user('message-'+i,m.text),tag:m.where,tick:m.tick,order:i*2+1});
 if(t.id==='import'&&t.state!=='question'){const index=(messages[t.id]||[]).findIndex(m=>m.step===step&&m.where.startsWith('Answer'));const answer=messages[t.id]?.[index];if(answer)events.push({id:'answer-receipt',who:'notice',text:'Simulated answer attached to step 3. No live worker received it.',tick:answer.tick,order:index*2+2});}
 const born={edit:8,'test-intro':8,test:8,'diff-intro':16,diff:16,final:20};
 return events.sort((a,b)=>(a.tick??(t.id==='thumbnails'?born[a.id]:0)??0)-(b.tick??(t.id==='thumbnails'?born[b.id]:0)??0)||(a.order??0)-(b.order??0));

function eventHtml(e,preview=false){

}
function navigate(id=selected,view='now',step){rememberScroll();if(id==='global')globalReturn=location.hash.slice(1)||'grid';const t=tasks.find(t=>t.id===id);const hash=['global','grid'].includes(id)?id:[id,view,step||t?.current||1].join('/');if(location.hash.slice(1)===hash){$('window').dataset.mobile='detail';render(true);}else location.hash=hash;}
function readRoute(){let [id,view,step]=location.hash.slice(1).split('/');const closing=globalOpen;globalOpen=id==='global';if(globalOpen)[id,view,step]=globalReturn.split('/');boardOpen=!id||id==='grid';if(!boardOpen){selected=tasks.some(t=>t.id===id)||id==='observed'?id:'import';tab=['now','chat','plan'].includes(view)?view:'now';viewedStep=Math.max(1,Math.min(task()?.steps.length||1,Number(step)||task()?.current||1));}$('window').dataset.mobile='detail';render(true);if(closing&&!globalOpen)$(boardOpen?'rail-global':'global-toggle').focus({preventScroll:true});}
function act(action){const t=task();if(!t)return;
 if(action==='approve'&&t.state==='recommendation'){t.state='running';t.model='Opus';t.contextTokens=null;t.latest='Retry approved for step 4 on Opus with the timeout trace attached.';receipts[t.id]={title:'Retry approved',text:'Recorded in this demo. A live task would now retry step 4 on Opus.'};}
 else if(action==='dismiss'&&t.state==='recommendation'){t.state='dismissed';receipts[t.id]={title:'Proposal dismissed',text:'The task stays visible under Paused. No retry was started.'};}
 else if(action==='revisit'&&t.state==='dismissed'){t.state='recommendation';delete receipts[t.id];}
 else if(action==='accept'&&t.state==='finished'){t.state='accepted';receipts[t.id]={title:'Result accepted',text:'The result and handoff remain available under Accepted.'};}
 else return;
 if(receipts[t.id])(messages[t.id]??=[]).push({step:t.current,text:receipts[t.id].title,where:'Operator decision · simulated',tick:demoTick});
 announce(`${t.number}: ${receipts[t.id]?.title||'Proposal reopened'} · simulated`);render();$('task-heading')?.focus({preventScroll:true});
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.project){setProject(b.dataset.project);return;}if(b.dataset.open){navigate(b.dataset.open,b.dataset.openView||'now');return;}if(b.dataset.tab){navigate(selected,b.dataset.tab,viewedStep);return;}if(b.dataset.step){navigate(selected,'chat',Number(b.dataset.step));return;}if('next'in b.dataset){const n=nextTask();if(n)navigate(n.id);return;}if('queue'in b.dataset){$('window').dataset.mobile='queue';$('search').focus({preventScroll:true});return;}if('return'in b.dataset){returnFromGlobal();return;}if(b.dataset.filter){filter=b.dataset.filter;renderQueue();document.querySelector(`[data-filter="${filter}"]`)?.focus({preventScroll:true});return;}if('clear'in b.dataset){filter='all';query='';$('search').value='';renderQueue();$('search').focus();return;}if(b.dataset.action){act(b.dataset.action);return;}if('gridFilter'in b.dataset){rememberScroll();gridFilter=b.dataset.gridFilter;render();document.querySelector(`[data-grid-filter="${gridFilter}"]`)?.focus({preventScroll:true});return;}if('decisions'in b.dataset){filter='needs';navigate(tasks.find(attention)?.id||selected);return;}if(b.dataset.follow){const id=b.dataset.follow;gridFollowing[id]=gridFollowing[id]===false;b.setAttribute('aria-pressed',String(gridFollowing[id]));b.textContent=gridFollowing[id]?'Following latest':'Jump to latest';if(gridFollowing[id]){const stream=document.querySelector(`[data-grid-stream="${id}"]`);stream.scrollTop=stream.scrollHeight;}return;}if(b.id==='playback'||'playback'in b.dataset){if(demoTick>=24)demoTick=0;demoPlaying=!demoPlaying;refreshStreams();updatePlayback();}});

document.addEventListener('input',e=>{const node=e.target;if(node.id==='search'){query=node.value;renderQueue();return;}if(node.id==='answer-draft'){drafts.questions[selected]=node.value;delete choices[selected];document.querySelectorAll('[name=notes]').forEach(r=>r.checked=false);}else if(node.id==='guidance-draft')drafts.steps[draftKey()]=node.value;else if(node.id==='global-draft')drafts.global=node.value;else return;node.form.querySelector('button[type=submit],button:not([type])').disabled=!node.value.trim();});
document.addEventListener('change',e=>{if(e.target.id==='project-select'){setProject(e.target.value);return;}if(e.target.id==='step-select'){navigate(selected,'chat',Number(e.target.value));return;}if(e.target.name==='notes'){choices[selected]=e.target.value;const value=e.target.value==='append'?'Append the imported notes and keep all existing notes.':'Replace existing notes with the imported text.';drafts.questions[selected]=value;$('answer-draft').value=value;$('answer-form').querySelector('[type=submit]').disabled=false;}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='global-form'){const text=drafts.global.trim();if(!text)return;globalMessages.push({who:'user',text},{who:'agent',text:'Your message stayed in this global conversation. This demo does not route it to tasks or call a provider.'});drafts.global='';renderGlobal();document.querySelector('.global-body').scrollTop=document.querySelector('.global-body').scrollHeight;$('global-draft').focus({preventScroll:true});announce('Global message recorded · simulated');return;}const t=task();if(!t)return;const answer=e.target.id==='answer-form';if(answer&&t.state!=='question'||!answer&&(e.target.id!=='guidance-form'||t.state!=='running'||viewedStep!==t.current))return;const text=(answer?drafts.questions[t.id]:drafts.steps[draftKey()]||'')?.trim();if(!text)return;(messages[t.id]??=[]).push({step:viewedStep,text,where:answer?'Answer to step '+viewedStep+' · simulated':'Guidance queued · simulated',tick:demoTick});if(answer){drafts.questions[t.id]='';t.state='running';t.latest='Your answer is attached to step 3. The task can continue with the selected merge rule.';receipts[t.id]={title:'Answer sent to step '+viewedStep,text:'Your decision is recorded in the step conversation. No live worker was started.'};}else drafts.steps[draftKey()]='';announce(`${t.number}: ${answer?'answer recorded':'guidance queued for the next safe boundary'} · simulated`);render();if(answer)$('task-heading')?.focus({preventScroll:true});else $('guidance-draft')?.focus({preventScroll:true});});
$('grid-toggle').onclick=()=>navigate('grid');
$('global-toggle').onclick=()=>globalOpen?returnFromGlobal():navigate('global');
$('rail-global').onclick=$('global-toggle').onclick;
$('all-decisions').onclick=()=>{rememberScroll();projectScope='all';gridFilter='needs';scrolls.grid=0;navigate('grid');};
$('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('theme').textContent=light?'Dark theme':'Light theme';};
$('reset').onclick=()=>{history.replaceState(null,'',location.href.split('#')[0]);location.reload();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&globalOpen)returnFromGlobal();});
window.addEventListener('hashchange',readRoute);
document.addEventListener('scroll',e=>{
 const stream=e.target;
 if(stream.matches?.('.global-body'))scrolls.global=stream.scrollTop;
 if(stream.matches?.('#main .detail-scroll,#main .grid-scroll'))scrolls[surfaceKey()]=stream.scrollTop;
 if(stream.matches?.('[data-grid-stream]')){
  const id=stream.dataset.gridStream;gridPositions[id]=stream.scrollTop;
  gridFollowing[id]=stream.scrollHeight-stream.scrollTop-stream.clientHeight<24;
  const button=document.querySelector(`[data-follow="${id}"]`);
  button.textContent=gridFollowing[id]?'Following latest':'Jump to latest';button.setAttribute('aria-pressed',String(gridFollowing[id]));
 }
},true);
function patchStream(stream,scroller,t,step,follow){
 const oldScroll=scroller.scrollTop,events=stepEvents(t,step),ids=new Set(events.map(e=>e.id));
 stream.querySelectorAll(':scope > [data-event]').forEach(node=>{if(!ids.has(node.dataset.event))node.remove();});
 for(const [index,event] of events.entries()){
  let node=stream.querySelector(`[data-event="${event.id}"]`);
  if(!node){stream.insertAdjacentHTML('beforeend',eventHtml(event));node=stream.lastElementChild;}
  if(stream.children[index]!==node)stream.insertBefore(node,stream.children[index]||null);
  for(const field of ['text','status','command','output']){
   const target=node.querySelector(`[data-field="${field}"]`);
   if(target&&target.textContent!==event[field])target.textContent=event[field];
  }
 }
 scroller.scrollTop=follow?scroller.scrollHeight:oldScroll;
}
function refreshStreams(){
 if(boardOpen){
  document.querySelectorAll('[data-grid-stream]').forEach(stream=>{
   if(!stream.getClientRects().length)return;
   const id=stream.dataset.gridStream,t=tasks.find(t=>t.id===id);
   patchStream(stream,stream,t,t.current,gridFollowing[id]!==false);
   document.querySelector(`[data-freshness="${id}"]`).textContent=freshness(t);
  });
 }else if(tab==='chat'&&viewedStep===task()?.current&&task().state==='running'){
  const scroller=document.querySelector('.detail-scroll');
  if(!scroller.getClientRects().length)return;
  patchStream($('transcript'),scroller,task(),viewedStep,scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<64);
 }
}
setInterval(()=>{if(!demoPlaying||document.hidden)return;demoTick++;if(demoTick>=24)demoPlaying=false;refreshStreams();updatePlayback();},1000);
demoPlaying=new URLSearchParams(location.search).get('stream')!=='paused'&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
if(new URLSearchParams(location.search).get('theme')==='light')$('theme').click();
renderUsage();
readRoute();
// shortcut: actions, streams, and drafts are tab-local fixtures; connect server-owned actions only after design approval.
</script>
