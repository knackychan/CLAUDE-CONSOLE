<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ContextCompanion</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="folded" class="peek" hidden>
    <div id="pill" class="pill"></div>
    <div id="peek"></div>
  </div>
  <div id="open" class="win">
    <div id="banner" class="banner" hidden><b>OFFLINE</b> The service stopped answering. Runs keep going; the window reconnects by itself.</div>

    <section data-page="board">
      <div class="top">
        <span class="grip drag-region" title="Drag to move">&#8942;&#8942;</span>
        <button id="scope" class="scope" data-pick aria-haspopup="listbox" aria-expanded="false" title="Project (Ctrl+P)"><span id="scopenm" class="nm">All projects</span><span class="car">&#9662;</span></button>
        <button id="needsbtn" class="needs" data-go="needs" title="Show what needs you, in every project" hidden></button>
        <span class="sp drag-region" title="Drag to move; double-click to fold"></span>
        <button id="hbtn" class="v-menu" data-go="hmenu" aria-haspopup="menu" aria-expanded="false" title="Usage, Models and tuning, Measure, Select done tasks">Menu <span class="car">&#9662;</span></button>
        <span data-winbtns></span>
      </div>
      <div id="vboard" class="v-board">
        <div class="v-left">
          <div id="bchain" class="v-chain" aria-label="Tasks and chats"></div>
          <div id="prepfail"></div>
          <div id="delbar" class="v-delbar" hidden></div>
          <div id="compose" class="compose">
            <div class="lr"><textarea id="c-prompt" rows="1" spellcheck="false" aria-label="New task"
              title="Enter = prep and plan · Ctrl+Enter = raw · Shift+Enter = new line · paste or drop files to attach"></textarea></div>
            <ul id="files-compose" class="files" aria-label="Attached files"></ul>
            <div id="c-say" class="say"></div>
          </div>
        </div>
        <div class="v-right">
          <div class="v-back"><button data-go="bback" title="Back to the chain (Esc)">&#8249; Board</button><span id="bbackwhat"></span></div>
          <section data-page="session" hidden>
            <div class="top" hidden>
              <button class="rb" data-go="back" title="Back (Esc)" aria-label="Back">&#8592;</button>
              <span id="pos" class="crumb m"></span>
              <button id="prev" class="rb" data-step="-1" title="Previous session (Up)" aria-label="Previous session">&#8249;</button>
              <button id="next" class="rb" data-step="1" title="Next session (Down)" aria-label="Next session">&#8250;</button>
              <span class="sp drag-region" title="Drag to move; double-click to fold"></span>
            </div>
            <div id="sscroll" class="scroll sess"><div id="sbody" class="body"></div><div id="proc" class="proc"></div></div>
            <div id="levers" class="levers"></div>
          </section>
          <div id="bwrap" class="bwrap"></div>
          <div id="iprep" class="v-iprep" hidden><div id="pscroll" class="scroll stack"></div><div id="pbar" class="levers"></div></div>
        </div>
      </div>
      <div id="bfoot" class="bfoot"></div>
      <input id="filepick" type="file" multiple hidden>
    </section>

    <section data-page="usage" hidden>
      <div class="top">
        <button class="rb" data-go="board" title="Back to the Board (Esc)" aria-label="Back">&#8592;</button>
        <span class="crumb m">Usage</span>
        <span class="sp drag-region" title="Drag to move; double-click to fold"></span>
        <span data-winbtns></span>
      </div>
      <div id="uscroll" class="scroll"></div>
    </section>

    <section data-page="models" hidden>
      <div class="top">
        <button class="rb" data-go="board" title="Back to the Board (Esc)" aria-label="Back">&#8592;</button>
        <span class="crumb m">Models and tuning</span>
        <span class="sp drag-region" title="Drag to move; double-click to fold"></span>
        <span data-winbtns></span>
      </div>
      <div id="mtabs" class="tabs" role="tablist"></div>
      <div id="mscroll" class="scroll mp"></div>
      <div id="mbar" class="levers"></div>
    </section>

    <div id="utip" class="utip" hidden></div>
    <div id="hmenu" class="pop hmenu" role="menu" aria-label="Menu" hidden></div>
    <div id="pop" class="pop" role="dialog" aria-label="Pick a project" hidden>
      <div class="find"><input id="pfind" aria-label="Find a project" placeholder="Find a project" autocomplete="off"><span class="kbd">Esc</span></div>
      <div id="prows" class="rows" role="listbox"></div>
      <button id="popen" class="prow native-only">Open folder&#8230;</button>
      <div class="foot"><span>&#8593; &#8595; move</span><span>Enter pick</span><span class="sort">sorted: needs you, live, recent</span></div>
    </div>
    <div id="rsz" class="rsz native-only" title="Drag to resize" aria-label="Resize window"></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
